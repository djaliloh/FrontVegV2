name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml"]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "mkdocs>=1.6,<2" mkdocs-material markdown-callouts
      - run: mkdocs build --strict
      # Publishes to the gh-pages branch; enable GitHub Pages on it once.
      - if: github.event_name == 'push'
        run: mkdocs gh-deploy --force
