[metadata]
name = napari-frontveg
version = 2.0.1
author = Abdoul Djalil OUSSEINI HAMZA
description = Geometry-Constrained Semantic Segmentation via Vision-Language Priors
classifiers =
    Framework :: napari

[options]
packages = find:
package_dir =
    =src
include_package_data = True
install_requires =
    napari[all]

[options.packages.find]
where = src

[options.entry_points]
napari.manifest =
    napari-frontveg = napari_frontveg:napari.yaml
