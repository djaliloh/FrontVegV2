[metadata]
name = frontvegV2
version = 2.2.0
description = Automated plant organ segmentation and leaf area estimation in trellised crops using side view monocular RGB images.
author = Abdoul Djalil OUSSEINI HAMZA
author_email = abdouldjalilo@gmail.com
url = https://github.com/djaliloh/FrontVegV2
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE.txt
classifiers =
    Framework :: napari
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Operating System :: OS Independent

[options]
packages = find_namespace:
package_dir =
    =src
include_package_data = True
install_requires =
    napari[all]
    numpy==1.26.4
    opencv-python==4.8.1.78
    pillow
    scipy
    matplotlib
    einops
    triton-windows; sys_platform == 'win32'
    triton; sys_platform == 'linux'
    setuptools==69.5.1
    scikit-learn
    decord
    psutil
    pycocotools
    pandas
    scikit-image

[options.extras_require]
dev =
    setuptools==69.5.1
    scikit-learn
    decord
    psutil



[options.packages.find]
where = src

[options.entry_points]
napari.manifest =
    frontvegV2 = napari_frontveg:napari.yaml

